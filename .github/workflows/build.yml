name: build

# Same pipeline as codemagic.yaml, but on GitHub's own macOS runners.
#
# Runner labels are not cosmetic here. macos-15 is an arm64 machine, and this
# account repeatedly failed to acquire one:
#   "The job was not acquired by Runner of type hosted even after multiple attempts"
#   "Due to capacity constraints, jobs targeting macOS arm64 runners may
#    experience longer queue times."
# macos-13 queued for ten minutes without ever being assigned, so the single
# label that actually works is macos-15-intel — Intel, not arm64.
#
# The archive step produces an UNSIGNED ipa on purpose. Signing happens locally
# with Sideloadly and the author's own free Apple ID, which is the only route
# available without a paid developer account.
on:
  workflow_dispatch:
    inputs:
      phases:
        description: "Space-separated beats to photograph (intro stage1 stage2 stage3 ask copy interlude reveal recap)"
        required: false
        # Asking for everything took longer than the step's timeout and the run
        # only came back with the first three. The default is the set that has
        # never been seen rendered; pass the full list when you want all of it.
        default: "ask copy interlude reveal recap"

jobs:
  build:
    name: build
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Pick an iPad simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available | sed -n 's/^ *\(iPad.*\) ([0-9A-Fa-f-]\{36\}) (.*$/\1/p' | head -1)
          echo "picked: $SIM"
          echo "name=$SIM" >> "$GITHUB_OUTPUT"

      - name: Build for simulator
        working-directory: ThirdRow.swiftpm
        run: |
          xcodebuild -scheme ThirdRow \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build \
            build

      # The ipa is the deliverable, so the archive runs before the screenshots.
      # bootstatus can block for many minutes on a cold Intel simulator, and
      # that must never cost us the ipa.
      - name: Archive for device without signing
        working-directory: ThirdRow.swiftpm
        run: |
          xcodebuild -scheme ThirdRow \
            -destination 'generic/platform=iOS' \
            -archivePath build-device/ThirdRow.xcarchive \
            -derivedDataPath build-device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            archive

      - name: Wrap into an unsigned ipa
        run: |
          APP=$(find ThirdRow.swiftpm/build-device -maxdepth 5 -path "*Applications*" -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          echo "bundle id: $(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")"
          echo "minimum iOS: $(plutil -extract MinimumOSVersion raw "$APP/Info.plist")"
          rm -rf Payload ThirdRow-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ThirdRow-unsigned.ipa Payload
          ls -lh ThirdRow-unsigned.ipa

      - name: Upload the ipa
        uses: actions/upload-artifact@v4
        with:
          name: thirdrow-ipa
          path: ThirdRow-unsigned.ipa
          if-no-files-found: error

      # The ipa is already stored above, so this step may time out freely.
      # A cold Intel simulator spends a couple of minutes on each relaunch, so
      # the beat list is an input: you ask for the beats you still need to see.
      - name: Screenshot every beat
        continue-on-error: true
        timeout-minutes: 25
        working-directory: ThirdRow.swiftpm
        env:
          PHASES: ${{ inputs.phases }}
        run: |
          APP=$(find build/Build/Products -name "*.app" -maxdepth 4 | head -1)
          echo "app: $APP"
          test -n "$APP"
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          SIM="${{ steps.sim.outputs.name }}"
          xcrun simctl boot "$SIM" || true
          # Bounded wait instead of bootstatus -b, which can block forever.
          for i in $(seq 1 60); do
            xcrun simctl list devices | grep -q "Booted" && break
            sleep 2
          done
          xcrun simctl install booted "$APP"
          for PHASE in ${PHASES:-ask copy interlude reveal recap}; do
            xcrun simctl terminate booted "$BID" || true
            sleep 1
            xcrun simctl launch booted "$BID" -startAt "$PHASE" || true
            # Four seconds was not enough on a cold simulator: intro, stage3 and
            # ask all came back as a blank launch screen.
            #
            # Reveal is the exception and needs its own timing: it advances by
            # itself at 9.6s, and a screenshot costs about a second on this
            # runner, so the old "shoot at 7s and again at 9s" pattern landed on
            # the recap twice. One shot at 5s catches the page card instead.
            if [ "$PHASE" = "reveal" ]; then
              sleep 5
              xcrun simctl io booted screenshot "../shot-$PHASE.png" || true
            else
              sleep 7
              xcrun simctl io booted screenshot "../shot-$PHASE.png" || true
              sleep 2
              xcrun simctl io booted screenshot "../shot-$PHASE.png" || true
            fi
            echo "captured $PHASE"
          done
          ls -la ../shot-*.png

      - name: Upload the screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: thirdrow-shots
          path: shot-*.png
          if-no-files-found: warn
