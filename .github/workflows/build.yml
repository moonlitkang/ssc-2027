name: build

# Same pipeline as codemagic.yaml, but on GitHub's own macOS runners.
#
# Runner labels are not cosmetic here. macos-15 is an arm64 machine, and this
# account repeatedly failed to acquire one:
#   "The job was not acquired by Runner of type hosted even after multiple attempts"
#   "Due to capacity constraints, jobs targeting macOS arm64 runners may
#    experience longer queue times."
# So the matrix targets Intel machines instead, both of them, and fail-fast is
# off so a slow or broken image on one label cannot cancel the other.
#
# The archive step produces an UNSIGNED ipa on purpose. Signing happens locally
# with Sideloadly and the author's own free Apple ID, which is the only route
# available without a paid developer account.
on:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.label }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        label:
          - macos-15-intel
          - macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Pick an iPad simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available | sed -n 's/^ *\(iPad.*\) ([0-9A-Fa-f-]\{36\}) (.*$/\1/p' | head -1)
          echo "picked: $SIM"
          echo "name=$SIM" >> "$GITHUB_OUTPUT"

      - name: Build for simulator
        working-directory: ThirdRow.swiftpm
        run: |
          xcodebuild -scheme ThirdRow \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath build \
            build

      # Never let a screenshot problem cost us the ipa. The archive below is
      # the deliverable; the shots are a bonus.
      - name: Screenshot every beat
        continue-on-error: true
        working-directory: ThirdRow.swiftpm
        run: |
          APP=$(find build/Build/Products -name "*.app" -maxdepth 4 | head -1)
          echo "app: $APP"
          test -n "$APP"
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          SIM="${{ steps.sim.outputs.name }}"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b || true
          xcrun simctl install booted "$APP"
          for PHASE in intro stage1 stage3 ask copy reveal recap; do
            xcrun simctl terminate booted "$BID" || true
            sleep 1
            xcrun simctl launch booted "$BID" -startAt "$PHASE" || true
            sleep 4
            xcrun simctl io booted screenshot "../shot-$PHASE.png" || true
            echo "captured $PHASE"
          done
          ls -la ../shot-*.png

      - name: Archive for device without signing
        working-directory: ThirdRow.swiftpm
        run: |
          xcodebuild -scheme ThirdRow \
            -destination 'generic/platform=iOS' \
            -archivePath build-device/ThirdRow.xcarchive \
            -derivedDataPath build-device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            archive

      - name: Wrap into an unsigned ipa
        run: |
          APP=$(find ThirdRow.swiftpm/build-device -maxdepth 5 -path "*Applications*" -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          echo "bundle id: $(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")"
          echo "minimum iOS: $(plutil -extract MinimumOSVersion raw "$APP/Info.plist")"
          rm -rf Payload ThirdRow-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ThirdRow-unsigned.ipa Payload
          ls -lh ThirdRow-unsigned.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: thirdrow-${{ matrix.label }}
          path: |
            ThirdRow-unsigned.ipa
            shot-*.png
          if-no-files-found: warn
