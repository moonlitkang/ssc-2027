name: probe

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "linux runner ok"

  macos:
    runs-on: macos-latest
    steps:
      - name: System info
        run: |
          sw_vers
          echo "--- xcodebuild ---"
          xcodebuild -version || true
          echo "--- installed Xcodes ---"
          ls /Applications | grep -i xcode || true
          echo "--- simulators (iPad only) ---"
          xcrun simctl list devices available | grep -i ipad | head -10 || true
