workflows:
  probe:
    name: Third Row / build probe
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        APP_PACKAGE: ThirdRow.swiftpm
        SCHEME: ThirdRow
    scripts:
      - name: Toolchain
        script: |
          echo "=== macOS ==="
          sw_vers
          echo "=== xcodebuild ==="
          xcodebuild -version
          echo "=== swift ==="
          swift --version
          echo "=== installed Xcodes ==="
          ls /Applications | grep -i xcode || true

      - name: Inspect the app package
        script: |
          echo "=== files ==="
          find "$APP_PACKAGE" -maxdepth 2 -type f | sort
          echo "=== xcodebuild -list (may fail for .swiftpm) ==="
          cd "$APP_PACKAGE"
          xcodebuild -list -json || true

      - name: Pick an iPad simulator
        script: |
          xcrun simctl list devices available | grep -i ipad | head -20 || true
          SIM=$(xcrun simctl list devices available | sed -n 's/^ *\(iPad.*\) ([0-9A-Fa-f-]\{36\}) (.*$/\1/p' | head -1)
          echo "picked simulator: $SIM"
          echo "SIM=$SIM" >> "$CM_ENV"

      - name: Build for simulator
        script: |
          cd "$APP_PACKAGE"
          xcodebuild -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM" \
            -derivedDataPath build \
            build

      - name: Install, launch and screenshot each beat
        script: |
          APP=$(find "$APP_PACKAGE/build/Build/Products" -name "*.app" -maxdepth 4 | head -1)
          echo "app bundle: $APP"
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          echo "bundle id: $BID"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b || true
          xcrun simctl install booted "$APP"
          for PHASE in intro stage1 stage3 ask copy reveal recap; do
            xcrun simctl terminate booted "$BID" || true
            sleep 1
            if [ "$PHASE" = "intro" ]; then
              xcrun simctl launch booted "$BID" || true
            else
              xcrun simctl launch booted "$BID" -startAt "$PHASE" || true
            fi
            if [ "$PHASE" = "reveal" ]; then sleep 2; else sleep 5; fi
            xcrun simctl io booted screenshot "shot-$PHASE.png" || true
            echo "captured $PHASE"
          done
          ls -la shot-*.png

    artifacts:
      - shot-*.png
      - ThirdRow.swiftpm/build/**/Build/*.xcactivitylog

  ipa:
    name: Third Row / unsigned ipa
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        APP_PACKAGE: ThirdRow.swiftpm
        SCHEME: ThirdRow
    scripts:
      - name: Archive for a real device without signing
        script: |
          echo "=== toolchain ==="
          xcodebuild -version
          cd "$APP_PACKAGE"
          xcodebuild -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath build/ThirdRow.xcarchive \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Report the bundle
        script: |
          echo "=== products ==="
          find "$APP_PACKAGE/build/ThirdRow.xcarchive/Products" -maxdepth 3 | head -20
          APP=$(find "$APP_PACKAGE/build/ThirdRow.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          echo "app bundle: $APP"
          if [ -z "$APP" ]; then
            echo "ARCHIVE PRODUCED NO APP BUNDLE"
            exit 1
          fi
          echo "=== Info.plist ==="
          plutil -p "$APP/Info.plist" | head -40
          echo "=== minimum iOS ==="
          plutil -extract MinimumOSVersion raw "$APP/Info.plist" || true

      - name: Wrap into an ipa
        script: |
          APP=$(find "$APP_PACKAGE/build/ThirdRow.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
          rm -rf Payload ThirdRow-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ThirdRow-unsigned.ipa Payload
          ls -la ThirdRow-unsigned.ipa
          echo "ipa ready"

    artifacts:
      - ThirdRow-unsigned.ipa
