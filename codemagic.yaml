workflows:
  build:
    name: Third Row / build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        APP_PACKAGE: ThirdRow.swiftpm
        SCHEME: ThirdRow
    scripts:
      - name: Toolchain
        script: |
          echo "=== macOS ==="
          sw_vers
          echo "=== xcodebuild ==="
          xcodebuild -version
          echo "=== swift ==="
          swift --version

      - name: Pick an iPad simulator
        script: |
          xcrun simctl list devices available | grep -i ipad | head -20 || true
          SIM=$(xcrun simctl list devices available | sed -n 's/^ *\(iPad.*\) ([0-9A-Fa-f-]\{36\}) (.*$/\1/p' | head -1)
          echo "picked simulator: $SIM"
          echo "SIM=$SIM" >> "$CM_ENV"

      - name: Build for simulator
        script: |
          cd "$APP_PACKAGE"
          xcodebuild -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM" \
            -derivedDataPath build \
            build

      - name: Screenshot every beat
        script: |
          APP=$(find "$APP_PACKAGE/build/Build/Products" -name "*.app" -maxdepth 4 | head -1)
          echo "app bundle: $APP"
          BID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          echo "bundle id: $BID"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b || true
          xcrun simctl install booted "$APP"
          for PHASE in intro stage1 stage3 ask copy reveal recap; do
            xcrun simctl terminate booted "$BID" || true
            sleep 1
            if [ "$PHASE" = "intro" ]; then
              xcrun simctl launch booted "$BID" || true
            else
              xcrun simctl launch booted "$BID" -startAt "$PHASE" || true
            fi
            if [ "$PHASE" = "reveal" ]; then sleep 2; else sleep 5; fi
            xcrun simctl io booted screenshot "shot-$PHASE.png" || true
            echo "captured $PHASE"
          done
          ls -la shot-*.png
        # Screenshots run before the archive on purpose: if archiving fails, the
        # build still produces something worth looking at.

      - name: Archive for a real device without signing
        script: |
          set +e
          cd "$APP_PACKAGE"
          xcodebuild -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath build-device/ThirdRow.xcarchive \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          STATUS=$?
          echo "archive exit status: $STATUS"
          find build-device -maxdepth 4 -name "*.app" || true
          exit 0

      - name: Wrap into an ipa
        script: |
          APP=$(find "$APP_PACKAGE/build-device" -maxdepth 5 -path "*Applications*" -name "*.app" | head -1)
          echo "app bundle: $APP"
          if [ -z "$APP" ]; then
            echo "NO APP BUNDLE - ipa not produced"
            exit 0
          fi
          echo "=== Info.plist ==="
          plutil -p "$APP/Info.plist" | head -40
          echo "=== minimum iOS ==="
          plutil -extract MinimumOSVersion raw "$APP/Info.plist" || true
          rm -rf Payload ThirdRow-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ThirdRow-unsigned.ipa Payload
          ls -la ThirdRow-unsigned.ipa

    artifacts:
      - shot-*.png
      - ThirdRow-unsigned.ipa
